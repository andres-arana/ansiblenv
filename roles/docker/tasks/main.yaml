---
- name: Add the docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: '{{ ansible_facts.distribution_release }}'
    components: stable
    architectures: amd64
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  become: true
  register: docker_repo

- name: Ensure docker is installed
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
      - containerd.io
    state: latest
    update_cache: "{{ docker_repo is changed }}"
  become: true

# Without limits, json-file logs grow forever. Only containers created after the
# restart pick this up; existing ones keep their old settings until recreated.
# This overwrites any existing daemon.json.
- name: Configure the docker daemon (log rotation)
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  become: true
  register: docker_daemon_config

- name: Restart docker to apply the daemon config
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
  become: true
  when: docker_daemon_config is changed

- name: Install the docker prune service
  ansible.builtin.copy:
    src: docker-prune.service
    dest: /etc/systemd/system/docker-prune.service
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Enable the docker prune service on boot
  ansible.builtin.systemd_service:
    name: docker-prune.service
    enabled: true
    daemon_reload: true
  become: true

[cursor.style]
blinking = "Always"
shape    = "Block"

[font]
size = 10

[font.normal]
family = "Inconsolata Nerd Font Mono"
style  = "Regular"

[terminal.shell]
program = "tmux"

[window]
decorations  = "none"
opacity      = 0.95
startup_mode = "Maximized"

# Apply the opacity to every cell background, not just the default one, so
# tmux and nvim (which paint explicit backgrounds) are transparent too.
[colors]
transparent_background_colors = true

[general]
live_config_reload = true
import             = ["~/.config/alacritty/gruvbox.toml"]

[env]
TERM = "alacritty"

[[keyboard.bindings]]
key   = "Return"
mods  = "Shift"
chars = "\u001B\r"

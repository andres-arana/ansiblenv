---
- name: Install zoxide
  ansible.builtin.apt:
    name: zoxide
    state: latest
  become: true

# --cmd j exposes the commands as j / ji instead of z / zi.
- name: Install the zoxide initializer
  ansible.builtin.copy:
    content: 'eval "$(zoxide init bash --cmd j)"'
    dest: ~/.bash.d/zoxide.bash
    force: true
    mode: '0644'

---
- name: Add the github cli repository
  ansible.builtin.deb822_repository:
    name: github-cli
    types: deb
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
  become: true

- name: Install git related software
  ansible.builtin.apt:
    name:
      - tig
      - git
      - gh
      - libnotify-bin
    state: latest
    update_cache: true
  become: true

- name: Setup .gitconfig
  ansible.builtin.copy:
    src: files/gitconfig
    dest: ~/.gitconfig
    mode: '0644'

- name: Setup .gitignore
  ansible.builtin.copy:
    src: files/gitignore
    dest: ~/.gitignore
    mode: '0644'

- name: Install gh shell completions
  ansible.builtin.copy:
    src: files/gh-completion.bash
    dest: ~/.bash.d/gh-completion.bash
    force: true
    mode: '0644'

- name: Create the gh config directory
  ansible.builtin.file:
    path: ~/.config/gh/
    state: directory
    mode: '0771'

- name: Setup gh config and aliases
  ansible.builtin.copy:
    src: files/gh-config.yml
    dest: ~/.config/gh/config.yml
    mode: '0600'

- name: Create the user binaries directory
  ansible.builtin.file:
    path: ~/.local/bin/
    state: directory
    mode: '0755'

- name: Install the gh-ci PR checks notifier used by the `gh ci` alias
  ansible.builtin.copy:
    src: files/gh-ci
    dest: ~/.local/bin/gh-ci
    mode: '0755'

- name: Setup tig gruvbox colorscheme (matches alacritty theme)
  ansible.builtin.copy:
    src: files/tigrc
    dest: ~/.tigrc
    mode: '0644'
  when: "'alacritty' in ansible_role_names"
